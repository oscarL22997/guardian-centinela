# API gateway de Guardián Centinela. ÚNICO servicio con puerto publicado (8080).
#   /              -> front
#   /api/dominio/  -> microservicio de dominio
#   /api/ia/       -> microservicio de IA (2 réplicas, round-robin)
worker_processes auto;
events { worker_connections 1024; }

http {
    # DNS interno de Docker: re-resuelve cada 5 s, así una réplica que reinicia con otra IP vuelve al pool
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format gc '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                  'upstream=$upstream_addr up_status=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout gc;
    error_log  /dev/stderr warn;

    server_tokens off;
    client_max_body_size 64k;
    # Tope global de tasa (seguridad 8.3). No es por IP: el core de pagos llega desde una sola IP.
    # 400 req/s ≈ 4x el peak del caso (5.500/min = 92 req/s); sobre eso responde 429 y protege a los servicios.
    map $request_method $tope_global { default "gc"; }
    limit_req_zone $tope_global zone=api:1m rate=400r/s;

    upstream front_up   { zone front 64k;   server front:80 resolve; }
    upstream dominio_up { zone dominio 64k; server dominio:8000 resolve max_fails=2 fail_timeout=10s; keepalive 16; }
    upstream ia_up      {
        zone ia 64k;
        # 'resolve' + DNS de Docker = una entrada por réplica de "ia"; nginx reparte round-robin.
        # Si una réplica no responde, se marca caída 10 s y la petición se reintenta en la otra.
        server ia:8000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }


    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Request-Id $request_id always;
        add_header X-Upstream $upstream_addr always;

        location = /health {
            access_log off; default_type application/json;
            return 200 '{"estado":"ok","servicio":"gateway"}';
        }

        location /api/dominio/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://dominio_up/;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location /api/ia/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://ia_up/;
            proxy_connect_timeout 300ms;
            proxy_read_timeout 1s;
            # /predict es idempotente (no escribe nada), por eso se puede reintentar en la otra réplica
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }

        location / { proxy_pass http://front_up; }

        # Errores del upstream como JSON (contrato estable para el front y el dominio)
        error_page 502 503 504 = @caido;
        location @caido {
            default_type application/json;
            return 503 '{"error":"servicio_no_disponible","detalle":"el gateway no obtuvo respuesta del servicio","request_id":"$request_id"}';
        }
        error_page 429 = @limite;
        location @limite {
            default_type application/json;
            return 429 '{"error":"demasiadas_peticiones"}';
        }
    }
}
